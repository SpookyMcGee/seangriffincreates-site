<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean Griffin Creates - Analog</title>
    <link rel="canonical" href="https://seangriffincreates.com/analog" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000 !important; /* Force black background */
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        #content {
            padding-top: 60px; /* Space for nav bar */
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8); /* Semi-transparent black */
            z-index: 100;
            padding: 1rem 0;
        }
        nav ul {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
        }
        nav a:hover {
            color: #ffcc00; /* Yellow hover effect */
        }
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            padding: 1rem;
            max-width: 1200px;
            margin: 0 auto;
        }
        .gallery a {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
        }
        .gallery img {
            width: 100%;
            height: auto;
            object-fit: cover;
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        /* Mobile Navigation */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: 1fr; /* Single column on mobile */
            }
            nav {
                padding: 0.5rem 0;
            }
        }
        /* Hamburger Menu */
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: #ffffff;
            cursor: pointer;
            padding: 0.5rem;
            position: absolute;
            top: 0.5rem;
            right: 1rem;
        }
        @media (max-width: 640px) {
            .menu-toggle {
                display: block;
            }
            nav ul {
                display: none;
                flex-direction: column;
                width: 100%;
            }
            nav ul.active {
                display: flex;
            }
        }
        .modal {
            display: none; /* Ensure modal starts hidden */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.9);
            z-index: 200;
            justify-content: center;
            align-items: center;
            overflow: auto; /* Allow scrolling if image is large */
        }
        .modal-content {
            max-width: 90%;
            max-height: 90vh;
            object-fit: contain;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #fff;
            font-size: 2rem;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <nav>
        <div class="menu-toggle">☰</div>
        <ul>
            <li><a href="index.html#photos">Photos</a></li>
            <li><a href="index.html#videos">Videos</a></li>
            <li><a href="index.html#sites">Sites</a></li>
            <li><a href="index.html#blog">Blog</a></li>
            <li><a href="index.html#about">About</a></li>
        </ul>
    </nav>

    <section id="content">
        <div id="gallery" class="gallery">
            <!-- Gallery will be populated dynamically -->
        </div>
    </section>

    <!-- Modal for Zoom -->
    <div id="modal" class="modal">
        <span class="close">×</span>
        <img id="modal-image" class="modal-content" src="" alt="Zoomed Image">
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.querySelector('.menu-toggle');
            const navUl = document.querySelector('nav ul');
            menuToggle.addEventListener('click', () => {
                navUl.classList.toggle('active');
            });

            // Zoom functionality
            const modal = document.getElementById('modal');
            const modalImage = document.getElementById('modal-image');
            const closeBtn = document.querySelector('.close');
            const gallery = document.getElementById('gallery');

            // List of analog images
            const images = [
   "images/analog/000020120021.jpg",

  "images/analog/R1-01565-021A.JPG",
  "images/analog/R1-01676-0008.JPG",
  "images/analog/R1-01714-0002.JPG",
  "images/analog/R1-01714-0014.JPG"
            ];

            // Shuffle function
            function shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
                return array;
            }

            // Shuffle images and populate gallery
            const shuffledImages = shuffle([...images]);
            gallery.innerHTML = ''; // Ensure no initial content
            shuffledImages.forEach((imgSrc, index) => {
                const link = document.createElement('a');
                link.href = '#';
                link.setAttribute('data-image', imgSrc);
                const img = document.createElement('img');
                img.src = imgSrc;
                img.alt = `Portrait ${index + 1}`;
                img.onload = () => console.log(`Loaded: ${imgSrc}`); // Debug load
                img.onerror = () => {
                    console.error(`Failed to load: ${imgSrc}`);
                    img.style.display = 'none'; // Hide on error
                };
                link.appendChild(img);
                gallery.appendChild(link);
            });

            // Attach zoom event to dynamically added links with debug
            const galleryLinks = document.querySelectorAll('.gallery a');
            galleryLinks.forEach(link => {
                link.addEventListener('click', (e) => {
                    e.preventDefault();
                    console.log('Clicked:', link.getAttribute('data-image')); // Debug click
                    modalImage.src = link.getAttribute('data-image');
                    modal.style.display = 'flex';
                });
            });

            closeBtn.addEventListener('click', () => {
                modal.style.display = 'none';
            });

            // Close modal when clicking outside the image
            modal.addEventListener('click', (e) => {
                if (e.target === modal) {
                    modal.style.display = 'none';
                }
            });
        });
    </script>
</body>
</html>
