<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sean Griffin Creates</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background-color: #000000; /* Pure black backdrop */
            margin: 0;
            padding: 0;
        }
        #splash {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #content {
            padding-top: 60px; /* Space for nav bar */
        }
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: rgba(0, 0, 0, 0.8); /* Semi-transparent black */
            z-index: 100;
            padding: 1rem 0;
        }
        nav ul {
            display: flex;
            justify-content: center;
            gap: 2rem;
            list-style: none;
            margin: 0;
            padding: 0;
        }
        nav a {
            color: #ffffff;
            text-decoration: none;
            font-weight: bold;
            padding: 0.5rem 1rem;
        }
        nav a:hover {
            color: #ffcc00; /* Yellow hover effect */
        }
        .gallery a {
            display: block;
            text-align: center;
            color: #ffffff;
            text-decoration: none;
        }
        .gallery img {
            width: 100%;
            height: auto;
            transition: transform 0.3s ease;
        }
        .gallery img:hover {
            transform: scale(1.05);
        }
        /* Mobile Navigation */
        @media (max-width: 768px) {
            nav ul {
                flex-direction: column;
                align-items: center;
                gap: 1rem;
                padding: 1rem 0;
            }
            .gallery {
                grid-template-columns: 1fr; /* Single column on mobile */
            }
            nav {
                padding: 0.5rem 0;
            }
        }
        /* Hamburger Menu */
        .menu-toggle {
            display: none;
            font-size: 1.5rem;
            color: #ffffff;
            cursor: pointer;
            padding: 0.5rem;
        }
        @media (max-width: 640px) {
            .menu-toggle {
                display: block;
                position: absolute;
                top: 0.5rem;
                right: 1rem;
            }
            nav ul {
                display: none;
                flex-direction: column;
                width: 100%;
            }
            nav ul.active {
                display: flex;
            }
        }
    </style>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const menuToggle = document.querySelector('.menu-toggle');
            const navUl = document.querySelector('nav ul');
            menuToggle.addEventListener('click', () => {
                navUl.classList.toggle('active');
            });
        });
    </script>
</head>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const menuToggle = document.querySelector('.menu-toggle');
        const navUl = document.querySelector('nav ul');
        if (menuToggle && navUl) {
            menuToggle.addEventListener('click', () => {
                navUl.classList.toggle('hidden');
                navUl.classList.toggle('flex');
            });
        } else {
            console.warn('Menu toggle or nav ul not found');
        }

        // Smooth scroll for internal links
        document.querySelectorAll('nav a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function (e) {
                e.preventDefault();
                const target = document.querySelector(this.getAttribute('href'));
                if (target) {
                    target.scrollIntoView({ behavior: 'smooth' });
                    navUl.classList.add('hidden'); // Hide menu on mobile after click
                }
            });
        });

        // Mobile toggle visibility
        const handleResize = () => {
            if (window.innerWidth > 640) {
                navUl.classList.remove('hidden');
                navUl.classList.add('flex');
            } else {
                navUl.classList.add('hidden');
            }
        };
        window.addEventListener('resize', handleResize);
        handleResize(); // Initial call
    });
</script>

<style>
    @media (max-width: 640px) {
        .menu-toggle {
            display: block;
        }

        }
